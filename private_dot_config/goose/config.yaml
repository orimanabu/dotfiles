extensions:
  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
  apps:
    enabled: true
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
  summarize:
    enabled: false
    type: platform
    name: summarize
    description: Load files/directories and get an LLM summary in a single call
    display_name: Summarize
    bundled: true
  orchestrator:
    enabled: false
    type: platform
    name: orchestrator
    description: 'Manage agent sessions: list, view, start, send messages, interrupt, and stop agents'
    display_name: Orchestrator
    bundled: true
  analyze:
    enabled: true
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true
  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    display_name: Chat Recall
    bundled: true
  skills:
    enabled: true
    type: platform
    name: skills
    description: Discover and provide skill instructions from filesystem and builtins
    display_name: Skills
    bundled: true
  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true
  github:
    enabled: true
    type: stdio
    name: GitHub
    description: GitHub official MCP
    cmd: npx
    args:
    - -y
    - '@modelcontextprotocol/server-github'
    envs: {}
    env_keys:
    - GITHUB_PERSONAL_ACCESS_TOKEN
    timeout: 300
    cwd: null
    bundled: null
  searxng:
    enabled: true
    type: stdio
    name: SearXNG
    description: Privacy-respecting metasearch engine MCP
    cmd: npx
    args:
    - -y
    - searxng-mcp
    envs: {}
    env_keys:
    - SEARXNG_SERVER_URL
    timeout: 300
    cwd: null
    bundled: null
GOOSE_TELEMETRY_ENABLED: false
#GOOSE_MODEL: Qwen3.6-35B-A3B-NVFP4
#GOOSE_MODEL: Qwen3.6-35B-A3B-uncensored-heretic-fixed2
#GOOSE_MODEL: gpt-oss-120b-ultra-heretic
#OPENAI_BASE_URL: http://192.168.10.34:8000
OPENAI_HOST: http://192.168.10.34:8000
OPENAI_BASE_PATH: v1/chat/completions
OPENAI_TIMEOUT: '300'
OPENAI_API_KEY: not-needed
active_provider: openai
providers:
  openai:
    enabled: true
    #model: Qwen3.8-Flash-Next-FP4-Local
    model: Qwen3.6-35B-A3B-NVFP4
    #model: Qwen3.6-35B-A3B-uncensored-heretic-fixed2
    #model: gpt-oss-120b-ultra-heretic
    configured: true
